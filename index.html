<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Pixel</title>

<style>
body{
margin:0;
background:#87CEEB;
overflow:hidden;
}

#map{
width:100vw;
height:100vh;
background:#55aa55;
position:relative;
}

#player{
width:50px;
height:50px;
background:gold;
position:absolute;
left:100px;
top:100px;
border:2px solid black;
}

#npc{
position:absolute;
left:300px;
top:150px;
font-size:50px;
}

#monster{
position:absolute;
left:600px;
top:250px;
font-size:50px;
}

#info{
position:fixed;
top:10px;
left:10px;
background:white;
padding:10px;
}
</style>
</head>
