<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nhân vật 2D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}

#map{
    width:100vw;
    height:100vh;
    position:relative;
}

#player{
    width:50px;
    height:50px;
    background:#ffcc00;
    border:2px solid black;
    position:absolute;
    left:100px;
    top:100px;
}
</style>
</head>

<body>

<div id="map">
    <div id="player"></div>
</div>

<script>

let player=document.getElementById("player");

let x=100;
let y=100;
let speed=10;

document.addEventListener("keydown",function(e){

if(e.key=="ArrowRight" || e.key=="d"){
x+=speed;
}

if(e.key=="ArrowLeft" || e.key=="a"){
x-=speed;
}

if(e.key=="ArrowUp" || e.key=="w"){
y-=speed;
}

if(e.key=="ArrowDown" || e.key=="s"){
y+=speed;
}

player.style.left=x+"px";
player.style.top=y+"px";

});

</script>

</body>
</html>
