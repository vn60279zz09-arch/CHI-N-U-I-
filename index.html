<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Chiến Đấu Đi! ⚔️</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.box{
    border:2px solid white;
    width:500px;
    max-width:90%;
    margin:auto;
    padding:20px;
}

button{
    padding:12px 20px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>⚔️ CHIẾN ĐẤU ĐI! ⚔️</h1>
<h2>Nhân vật: Admin Dương Minh Đức</h2>

<div class="box">
    <p>Level: <span id="level">1</span>/200</p>
    <p>EXP: <span id="exp">0</span></p>
    <p>Kill: <span id="kill">0</span></p>
    <p>Vàng: <span id="gold">0</span></p>
    <p>Sức mạnh: <span id="power">100</span></p>
    <p>Máu: <span id="hp">1000</span></p>
    <p>Võ công: <span id="skill">Chưa có</span></p>
</div>

<br>

<button onclick="fight()">⚔️ Đánh quái</button>
<button onclick="teleport()">🌀 Dịch chuyển (50.000 vàng)</button>

<h3 id="msg"></h3>

<script>

let level = 1;
let exp = 0;
let kill = 0;
let gold = 0;
let power = 100;
let hp = 1000;
let skill = "Chưa có";

function update(){
    document.getElementById("level").textContent = level;
    document.getElementById("exp").textContent = exp;
    document.getElementById("kill").textContent = kill;
    document.getElementById("gold").textContent = gold;
    document.getElementById("power").textContent = power;
    document.getElementById("hp").textContent = hp;
    document.getElementById("skill").textContent = skill;
}

function fight(){

    kill++;
    exp += 100;
    gold += 20000;

    while(level < 200 && exp >= level * 100){
        exp -= level * 100;
        level++;

        power += 50;
        hp += 100;
    }

    if(level > 200){
        level = 200;
    }

    document.getElementById("msg").textContent =
        "Bạn đã hạ được đối thủ!";

    update();
}

function teleport(){

    if(gold < 50000){
        alert("Cần 50.000 vàng!");
        return;
    }

    gold -= 50000;

    let r = Math.random() * 100;

    if(r < 20){
        skill = "⚡ Võ Điện";
    }
    else if(r < 50){
        skill = "🔥 Võ Lửa";
    }
    else{
        skill = "🐟 Võ Cá";
    }

    document.getElementById("msg").textContent =
        "Bạn nhận được: " + skill;

    update();
}

update();

</script>

</body>
</html>
