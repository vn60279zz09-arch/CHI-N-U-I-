
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>CHIẾN ĐẤU ĐI ONLINE</title>

<style>
body{
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
}

.box{
    border:2px solid white;
    width:700px;
    margin:auto;
    padding:20px;
}

button{
    padding:10px;
    margin:5px;
    font-size:18px;
}

#avatar{
    font-size:100px;
}
</style>
</head>

<body>

<h1>⚔️ CHIẾN ĐẤU ĐI ONLINE ⚔️</h1>

<div id="avatar">👷</div>

<h2 id="name">Công Nhân</h2>

<div class="box">

<p>Level: <span id="level">1</span>/200</p>

<p>EXP: <span id="exp">0</span></p>

<p>Máu: <span id="hp">1000</span></p>

<p>Sức mạnh: <span id="power">100</span></p>

<p>Vàng: <span id="gold">0</span></p>

<p>Võ Công: <span id="skill">Chưa Có</span></p>

<p>Đảo: <span id="island">Đảo Khởi Đầu</span></p>

</div>

<br>

<button onclick="fight()">⚔️ Đánh Quái</button>

<button onclick="randomSkill()">🎲 Random Võ</button>

<button onclick="phone()">📱 Điện Thoại</button>

<button onclick="changeSkin()">🎭 Đổi Ngoại Hình</button>

<h2 id="msg"></h2>

<script>

let level=1;
let exp=0;
let hp=1000;
let power=100;
let gold=0;

let skill="Chưa Có";

let island="Đảo Khởi Đầu";

function update(){

document.getElementById("level").innerText=level;
document.getElementById("exp").innerText=exp;
document.getElementById("hp").innerText=hp;
document.getElementById("power").innerText=power;
document.getElementById("gold").innerText=gold;
document.getElementById("skill").innerText=skill;
document.getElementById("island").innerText=island;

if(level>=50){
document.getElementById("avatar").innerText="🦸";
document.getElementById("name").innerText="SUPERMAN";
}

if(level>=50){
island="Đảo Trời";
}

if(level>=80){
island="Đảo Rừng";
}

if(level>=120){
island="Đảo Ma";
}

if(level>=160){
island="Đảo Nhà Tù";
}

}

function fight(){

let damage=3;

if(skill=="⚡ Võ Điện"){
damage=999999;
}

exp+=100;
gold+=1000;

while(exp>=level*100 && level<200){

exp-=level*100;
level++;

hp+=500;
power+=200;

}

document.getElementById("msg").innerText=
"Bạn đánh quái gây "+damage+" sát thương!";

update();

}

function randomSkill(){

let r=Math.random()*100;

if(r<1){

skill="⚡ Võ Điện";

}
else if(r<50){

skill="🔥 Võ Lửa";

}
else{

skill="🐟 Võ Cá";

}

document.getElementById("msg").innerText=
"Bạn nhận được "+skill;

update();

}

function phone(){

let code=prompt("Nhập mật mã:");

if(code=="0000"){

level=200;
power=9999999;
hp=9999999;
skill="⚡ Võ Điện";

alert("MAX CẤP!");

}

update();

}

function changeSkin(){

if(level<100){

alert("Level 100 mới đổi được!");

return;

}

let skin=prompt(
"Nhập emoji nhân vật:"
);

if(skin){

document.getElementById("avatar").innerText=skin;

}

}

update();

</script>

</body>
</html>
